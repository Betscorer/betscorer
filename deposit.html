<!DOCTYPE html>
<html>
<head>
<title>Deposit</title>

<style>

body{
background:#0f172a;
color:white;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:#1e293b;
padding:30px;
border-radius:10px;
width:350px;
}

input{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:5px;
}

button{
width:100%;
padding:12px;
margin-top:15px;
background:#00b74a;
border:none;
color:white;
cursor:pointer;
}

</style>

</head>

<body>

<div class="box">

<h2>Add Demo Credits</h2>

<p>Demo credits only. This does not process a real payment.</p>

<label for="amount">Amount</label>
<input
type="number"
id="amount"
placeholder="Enter Amount"
min="0.01"
max="10000"
step="0.01">

<label for="password">Confirm your password</label>
<input
type="password"
id="password"
placeholder="Account password"
autocomplete="current-password"
required>

<button type="button" data-wallet-action="deposit">
Add Demo Credits
</button>

<p>Demo balance: $<span id="balance">0.00</span></p>
<p id="wallet-message" role="alert" aria-live="polite"></p>

</div>

<script src="wallet.js"></script>

</body>
</html>
