<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BetVerse Register</title>

<style>

body{
background:#0f172a;
font-family:Arial,sans-serif;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.box{
background:#1e293b;
padding:30px;
width:350px;
border-radius:10px;
color:white;
}

h1{
text-align:center;
color:#00b74a;
}

input{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:5px;
}

button{
width:100%;
padding:12px;
margin-top:15px;
background:#00b74a;
border:none;
color:white;
font-size:16px;
border-radius:5px;
cursor:pointer;
}

button:hover{
background:#00963d;
}

a{
color:#00b74a;
text-decoration:none;
}

p{
text-align:center;
margin-top:15px;
}

</style>

</head>

<body>

<div class="box">

<h1>Create Account</h1>

<input
type="text"
id="username"
placeholder="Username"
autocomplete="username"
required>

<input
type="email"
id="email"
placeholder="Email"
autocomplete="email"
required>

<input
type="password"
id="password"
placeholder="Password"
autocomplete="new-password"
minlength="6"
required>

<button type="button" data-auth-action="register">
Register
</button>

<p id="auth-message" role="alert"></p>

<p>
Already have an account?
<a href="login.html">Login</a>
</p>

</div>

<script>

async function register(){

const username =
document.getElementById("username").value;

const email =
document.getElementById("email").value;

const password =
document.getElementById("password").value;

const response =
await fetch(
"https://betscorer-api.sangoblaise51.workers.dev/register",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
username,
email,
password
})
}
);

const result =
await response.json();

if(result.success){

alert("Account created!");

window.location.href =
"login.html";

}else{

alert("Registration failed");

}

}

document
.querySelector(
'[data-auth-action="register"]'
)
.addEventListener(
"click",
register
);

</script>


</body>
</html>
