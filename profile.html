<!DOCTYPE html>
<html>
<head>
<title>My Profile</title>

<style>

body{
background:#0f172a;
color:white;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{
background:#1e293b;
padding:30px;
width:400px;
border-radius:10px;
}

h1{
color:#00b74a;
}

.info{
margin:15px 0;
font-size:18px;
}

button{
width:100%;
padding:12px;
background:red;
border:none;
color:white;
cursor:pointer;
border-radius:5px;
}

</style>

</head>

<body>

<div class="card">

<h1>Profile</h1>

<div class="info">
Username:
<span id="username"></span>
</div>

<div class="info">
Email:
<span id="email"></span>
</div>

<div class="info">
Balance:
<span id="balance"></span>
</div>

<button id="logout" type="button">
Logout
</button>

<p id="profile-message" role="alert"></p>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="profile.js"></script>

</body>
</html>
